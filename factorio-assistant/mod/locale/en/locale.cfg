[mod-setting-description]
factorio-assistant-enable-combinator-telemetry=Read placed Factorio Assistant Combinators and publish their circuit signals. Disabled by default for crash diagnosis.
factorio-assistant-combinator-scan-interval=How often placed Factorio Assistant Combinators are scanned.
factorio-assistant-read-red-wire=Include signals from the red circuit wire network.
factorio-assistant-read-green-wire=Include signals from the green circuit wire network.
factorio-assistant-max-combinator-signals=Limit the number of signals written for each combinator snapshot.
factorio-assistant-enable-event-telemetry=Write player, combat, research, rocket, chat, and entity events to the telemetry file.
factorio-assistant-world-snapshot-interval=How often world and player state snapshots are written.
factorio-assistant-include-inventory-details=Include player armor and inventory usage in world snapshots.
