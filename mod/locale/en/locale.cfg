[mod-setting-description]
factorio-assistant-enable-combinator-telemetry=Read placed Factorio Assistant Combinators and publish their circuit signals. Disabled by default for crash diagnosis.
factorio-assistant-combinator-scan-interval=How often placed Factorio Assistant Combinators are scanned.
factorio-assistant-read-red-wire=Include signals from the red circuit wire network.
factorio-assistant-read-green-wire=Include signals from the green circuit wire network.
factorio-assistant-slot-a-signal=Signal ID used as the preferred global label for input slot A. Raw A-D values remain unchanged.
factorio-assistant-slot-b-signal=Signal ID used as the preferred global label for input slot B. Raw A-D values remain unchanged.
factorio-assistant-slot-c-signal=Signal ID used as the preferred global label for input slot C. Raw A-D values remain unchanged.
factorio-assistant-slot-d-signal=Signal ID used as the preferred global label for input slot D. Raw A-D values remain unchanged.
factorio-assistant-max-combinator-signals=Limit the number of signals written for each combinator snapshot.
factorio-assistant-enable-event-telemetry=Write player, combat, research, rocket, chat, and entity events to the telemetry file.
factorio-assistant-world-snapshot-interval=How often world and player state snapshots are written.
factorio-assistant-include-inventory-details=Include player armor and inventory usage in world snapshots.
factorio-assistant-enable-factory-building=Allow Home Assistant to create ghost entities through the factory builder service. Disabled by default.
factorio-assistant-enable-real-entity-placement=Allow Home Assistant to create real entities through the factory builder service. Requires factory building to also be enabled. Disabled by default.
factorio-assistant-enable-item-grants=Allow Home Assistant to give items to named players. Disabled by default.
factorio-assistant-enable-factory-demolition=Allow Home Assistant to mark entities for deconstruction or remove them. Disabled by default.
factorio-assistant-enable-enemy-clearing=Allow Home Assistant to clear enemy units. Disabled by default.
