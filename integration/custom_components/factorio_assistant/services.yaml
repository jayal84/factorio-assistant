dispatch_ltn_command:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: factorio_assistant
    action:
      required: true
      selector:
        select:
          options:
            - clear_all_surface_connections
            - exclude_from_fuel_schedule
            - get_or_create_next_temp_stop
            - get_next_logistic_stop
            - reassign_delivery
    name:
      default: ""
      selector:
        text:
    train_id:
      default: 0
      selector:
        number:
          mode: box
    old_train_id:
      default: 0
      selector:
        number:
          mode: box
    new_train_id:
      default: 0
      selector:
        number:
          mode: box
    schedule_index:
      default: 0
      selector:
        number:
          mode: box

