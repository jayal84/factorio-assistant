search_catalog:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: factorio_assistant
    query:
      required: true
      selector:
        text:
    search_type:
      default: all
      selector:
        select:
          options:
            - all
            - item
            - entity
            - recipe
            - technology
    limit:
      default: 25
      selector:
        number:
          min: 1
          max: 50
          mode: box
    offset:
      default: 0
      selector:
        number:
          min: 0
          max: 10000
          mode: box

get_catalog_entry:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: factorio_assistant
    name:
      required: true
      selector:
        text:
    kind:
      default: ""
      selector:
        text:
    detail:
      default: full
      selector:
        select:
          options:
            - full
            - compact

get_catalog_production:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: factorio_assistant
    items:
      required: true
      example: "[{\"name\":\"iron-plate\",\"rate\":60}]"
      selector:
        text:
          multiline: true
    known_recipes:
      default: "[]"
      selector:
        text:
          multiline: true

